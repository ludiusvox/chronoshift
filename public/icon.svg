<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="clock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="12"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#clock)" stroke-width="14" stroke-dasharray="800" stroke-dashoffset="240" stroke-linecap="round"/>
  
  <!-- Dial ticks -->
  <line x1="256" y1="110" x2="256" y2="126" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="386" x2="256" y2="402" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="256" x2="126" y2="256" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="386" y1="256" x2="402" y2="256" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="330" y2="256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="14" fill="#f8fafc"/>
  
  <!-- Small calendar / 2-week badge -->
  <rect x="290" y="290" width="100" height="90" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <path d="M 290 316 L 390 316" stroke="#38bdf8" stroke-width="3"/>
  <text x="340" y="362" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle">14</text>
  <circle cx="316" cy="304" r="3" fill="#94a3b8"/>
  <circle cx="364" cy="304" r="3" fill="#94a3b8"/>
</svg>
